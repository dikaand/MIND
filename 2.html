<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    /* =====================================
       SUPABASE CONFIGURATION
       Gunakan URL dan key yang sama
    ===================================== */

    const SUPABASE_URL = "https://ysnmknwfisoplrqchanp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_lynalr3nWQLWk1F2Fsg00A_3MIIdCZH";

    const { createClient } = supabase;
    const db = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    const notesList = document.getElementById("notesList");


    /* =====================================
       LOAD NOTES FROM SUPABASE
    ===================================== */

    async function loadNotes() {
        notesList.innerHTML = `
            <div class="empty-notes">
                <div class="empty-icon">✦</div>
                <h3>Loading thoughts...</h3>
                <p>Please wait a moment.</p>
            </div>
        `;

        const { data: notes, error } = await db
            .from("notes")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (error) {
            console.error(error);

            notesList.innerHTML = `
                <div class="empty-notes">
                    <div class="empty-icon">!</div>
                    <h3>Unable to load notes</h3>
                    <p>Check your Supabase URL, key, and policies.</p>
                </div>
            `;

            return;
        }

        notesList.innerHTML = "";

        if (!notes || notes.length === 0) {
            notesList.innerHTML = `
                <div class="empty-notes">
                    <div class="empty-icon">✦</div>
                    <h3>No thoughts yet</h3>
                    <p>Your first thought is waiting to be written.</p>
                </div>
            `;

            return;
        }

        notes.forEach(function(note, index) {
            const card = document.createElement("article");

            card.className = "saved-note-card";

            const previewText = getPreviewText(note.text, 8);

            card.innerHTML = `
                <div class="saved-note-header">
                    <div>
                        <span class="journal-label">
                            ✦ NOTE ${notes.length - index}
                        </span>

                        <p class="note-date">
                            ${escapeHTML(note.date)}
                        </p>
                    </div>

                    <div style="
                        display:flex;
                        gap:8px;
                        align-items:center;
                    ">
                        <button
                            class="edit-single"
                            onclick="editNote('${note.id}')"
                            title="Edit note"
                        >
                            ✎
                        </button>

                        <button
                            class="delete-single"
                            onclick="deleteNote('${note.id}')"
                            title="Delete note"
                        >
                            ×
                        </button>
                    </div>
                </div>

                <div class="saved-note-content">
                    <p>
                        ${escapeHTML(previewText)}
                    </p>
                </div>

                <div class="saved-note-footer">
                    <span>${note.words} words</span>
                    <span>MIND JOURNAL</span>
                </div>
            `;

            notesList.appendChild(card);
        });
    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
    }

    function getPreviewText(text, maxWords = 8) {
        const cleaned = String(text ?? "")
            .replace(/\s+/g, " ")
            .trim();

        if (!cleaned) {
            return "No content";
        }

        const words = cleaned.split(" ");
        const preview = words.slice(0, maxWords).join(" ");

        return words.length > maxWords ? preview + "..." : preview;
    }


    /* =====================================
       EDIT NOTE
    ===================================== */

    function editNote(id) {
        window.location.href =
            "1.html?edit=" + encodeURIComponent(id);
    }


    /* =====================================
       DELETE NOTE
    ===================================== */

    async function deleteNote(id) {
        const confirmed = confirm(
            "Are you sure you want to delete this note?"
        );

        if (!confirmed) {
            return;
        }

        const { error } = await db
            .from("notes")
            .delete()
            .eq("id", id);

        if (error) {
            console.error(error);
            alert("Failed to delete note.");
            return;
        }

        loadNotes();
    }


    loadNotes();
</script>
